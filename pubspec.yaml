name: sim_card_code
description: "A Flutter plugin for accessing SIM card details, phone number country code, network info, eSIM status and multi-SIM information."
version: 0.2.0

repository: https://github.com/mustafa-707/sim_card_code
issue_tracker: https://github.com/mustafa-707/sim_card_code/issues

topics:
  - sim-card
  - telephony
  - esim
  - carrier
  - phone-number

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.sim_card_code
        pluginClass: SimCardCodePlugin
      ios:
        pluginClass: SimCardCodePlugin
